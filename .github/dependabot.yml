version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    open-pull-requests-limit: 10
    rebase-strategy: auto
    schedule:
      interval: daily

  - package-ecosystem: "docker"
    directories:
      - "/"
    open-pull-requests-limit: 10
    rebase-strategy: auto
    schedule:
      interval: daily
