on:
  schedule:
    - cron: '0 1 5 * *'
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

env:
  SOURCE_REPOSITORY: shuwariafrica/container-images

jobs:

  build:
    name: "[${{ matrix.image }}: JDK ${{ matrix.java-version }} / ${{ matrix.platform }}] Build"
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        image: [ el10, alpine, alpine-edge, ubuntu26, fedora, rawhide ]
        java-version: [ "17", "21", "25" ]
        platform: [ amd64, arm64 ]
        include:
          - platform: amd64
            runner: ubuntu-latest
          - platform: arm64
            runner: ubuntu-24.04-arm
          - image: alpine-edge
            dockerfile: alpine.jdk.Dockerfile
            extra-build-args: "ALPINE_VERSION=edge"
          - image: fedora
            dockerfile: fedora.jdk.Dockerfile
          - image: rawhide
            dockerfile: fedora.jdk.Dockerfile
            extra-build-args: "FEDORA_VERSION=rawhide"
    env:
      IMAGE: shuwariafrica/${{ matrix.image }}-jdk
      LOCAL_TAG: build-${{ matrix.image }}-${{ matrix.java-version }}:current

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        if: github.event_name != 'pull_request' && github.repository == env.SOURCE_REPOSITORY
        uses: docker/login-action@v4.5.2
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_KEY }}

      - name: Build local image (amd64 only, for manifest hash)
        if: matrix.platform == 'amd64'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile || format('{0}.jdk.Dockerfile', matrix.image) }}
          platforms: linux/amd64
          load: true
          tags: ${{ env.LOCAL_TAG }}
          build-args: |
            JDK_VERSION=${{ matrix.java-version }}
            ${{ matrix.extra-build-args }}
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.platform }}
          cache-to: type=gha,scope=${{ matrix.image }}-${{ matrix.platform }},mode=max

      - name: Compute manifest hash (amd64 only)
        if: matrix.platform == 'amd64'
        id: vh
        run: |
          HASH=$(docker run --rm "$LOCAL_TAG" cat /etc/image-manifest.sha256 | tr -d '[:space:]')
          SHORT="${HASH:0:12}"
          echo "hash=$HASH"   >> "$GITHUB_OUTPUT"
          echo "short=$SHORT" >> "$GITHUB_OUTPUT"
          echo "Image manifest hash: $HASH"

      - name: Build & push by digest
        id: push
        if: github.event_name != 'pull_request' && github.repository == env.SOURCE_REPOSITORY
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile || format('{0}.jdk.Dockerfile', matrix.image) }}
          platforms: linux/${{ matrix.platform }}
          build-args: |
            JDK_VERSION=${{ matrix.java-version }}
            ${{ matrix.extra-build-args }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.platform }}
          cache-to: type=gha,scope=${{ matrix.image }}-${{ matrix.platform }},mode=max

      - name: Stage digest for upload
        if: github.event_name != 'pull_request' && github.repository == env.SOURCE_REPOSITORY
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.push.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest artifact
        if: github.event_name != 'pull_request' && github.repository == env.SOURCE_REPOSITORY
        uses: actions/upload-artifact@v7
        with:
          name: digest-${{ matrix.image }}-${{ matrix.java-version }}-${{ matrix.platform }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

      - name: Stage manifest hash for upload (amd64 only)
        if: matrix.platform == 'amd64' && github.event_name != 'pull_request' && github.repository == env.SOURCE_REPOSITORY
        run: |
          mkdir -p /tmp/hash
          echo "${{ steps.vh.outputs.short }}" > /tmp/hash/short
          echo "${{ steps.vh.outputs.hash }}"  > /tmp/hash/full

      - name: Upload manifest hash artifact (amd64 only)
        if: matrix.platform == 'amd64' && github.event_name != 'pull_request' && github.repository == env.SOURCE_REPOSITORY
        uses: actions/upload-artifact@v7
        with:
          name: hash-${{ matrix.image }}-${{ matrix.java-version }}
          path: /tmp/hash/
          if-no-files-found: error
          retention-days: 1

  merge:
    name: "[${{ matrix.image }}: JDK ${{ matrix.java-version }}] Merge multi-arch manifest"
    needs: build
    if: github.event_name != 'pull_request' && github.repository == 'shuwariafrica/container-images'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: [ el10, alpine, alpine-edge, ubuntu26, fedora, rawhide ]
        java-version: [ "17", "21", "25" ]
    env:
      IMAGE: shuwariafrica/${{ matrix.image }}-jdk

    steps:
      - name: Download digest artifacts
        uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digest-${{ matrix.image }}-${{ matrix.java-version }}-*
          merge-multiple: true

      - name: Download manifest hash artifact
        uses: actions/download-artifact@v8
        with:
          name: hash-${{ matrix.image }}-${{ matrix.java-version }}
          path: /tmp/hash

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4.5.2
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_KEY }}

      - name: Read manifest hash
        id: vh
        run: echo "short=$(cat /tmp/hash/short)" >> "$GITHUB_OUTPUT"

      - name: Check whether multi-arch manifest is already published
        id: gate
        run: |
          IMMUTABLE="${IMAGE}:${{ matrix.java-version }}-${{ steps.vh.outputs.short }}"
          if RAW=$(docker buildx imagetools inspect --raw "$IMMUTABLE" 2>/dev/null); then
            PLATFORM_COUNT=$(echo "$RAW" | jq -r '.manifests[]?.platform.architecture // empty' | grep -E '^(amd64|arm64)$' | sort -u | wc -l)
            if [ "$PLATFORM_COUNT" -ge 2 ]; then
              echo "Skipping merge: $IMMUTABLE already exists as a multi-arch manifest."
              echo "skip=true" >> "$GITHUB_OUTPUT"
            else
              echo "Re-publishing: $IMMUTABLE exists but is not multi-arch (found $PLATFORM_COUNT linux/* manifest(s))."
              echo "skip=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "Will merge: $IMMUTABLE is new."
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create multi-arch manifest list
        if: steps.gate.outputs.skip == 'false'
        working-directory: /tmp/digests
        run: |
          MAJOR_TAG="${IMAGE}:${{ matrix.java-version }}"
          IMMUTABLE_TAG="${IMAGE}:${{ matrix.java-version }}-${{ steps.vh.outputs.short }}"
          SOURCES=$(printf "${IMAGE}@sha256:%s " *)
          docker buildx imagetools create \
            --tag "$MAJOR_TAG" \
            --tag "$IMMUTABLE_TAG" \
            $SOURCES
          docker buildx imagetools inspect "$IMMUTABLE_TAG"
