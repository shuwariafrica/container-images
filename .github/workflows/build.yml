on:
  schedule:
    - cron: '0 1 5 * *'
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

env:
  SOURCE_REPOSITORY: shuwariafrica/container-images

jobs:

  build:
    name: "[${{ matrix.image }}: JDK ${{ matrix.java-version }}] Build"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: [ el10, alpine ]
        java-version: [ "17", "21", "25" ]
    env:
      IMAGE: shuwariafrica/${{ matrix.image }}-jdk
      LOCAL_TAG: build-${{ matrix.image }}-${{ matrix.java-version }}:current

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        if: github.event_name != 'pull_request' && github.repository == env.SOURCE_REPOSITORY
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_KEY }}

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.image }}.jdk.Dockerfile
          load: true
          tags: ${{ env.LOCAL_TAG }}
          build-args: |
            JDK_VERSION=${{ matrix.java-version }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max

      - name: Compute manifest hash
        id: vh
        run: |
          HASH=$(docker run --rm "$LOCAL_TAG" cat /etc/image-manifest.sha256 | tr -d '[:space:]')
          SHORT="${HASH:0:12}"
          echo "hash=$HASH"   >> "$GITHUB_OUTPUT"
          echo "short=$SHORT" >> "$GITHUB_OUTPUT"
          echo "Image manifest hash: $HASH"

      - name: Check whether this manifest is already published
        id: gate
        if: github.event_name != 'pull_request' && github.repository == env.SOURCE_REPOSITORY
        run: |
          IMMUTABLE="${IMAGE}:${{ matrix.java-version }}-${{ steps.vh.outputs.short }}"
          if docker buildx imagetools inspect "$IMMUTABLE" >/dev/null 2>&1; then
            echo "Skipping push: $IMMUTABLE already exists."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "Will push: $IMMUTABLE is new."
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Tag and push
        if: github.event_name != 'pull_request' && github.repository == env.SOURCE_REPOSITORY && steps.gate.outputs.skip == 'false'
        run: |
          MAJOR_TAG="${IMAGE}:${{ matrix.java-version }}"
          IMMUTABLE_TAG="${IMAGE}:${{ matrix.java-version }}-${{ steps.vh.outputs.short }}"
          docker tag "$LOCAL_TAG" "$MAJOR_TAG"
          docker tag "$LOCAL_TAG" "$IMMUTABLE_TAG"
          docker push "$IMMUTABLE_TAG"
          docker push "$MAJOR_TAG"
